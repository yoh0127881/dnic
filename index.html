<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1dc"><title>몽글 핑퐁 기록장</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff1dc;color:#75513f;font-family:system-ui,"Apple SD Gothic Neo",sans-serif}main{max-width:650px;margin:auto;padding:25px 16px 90px}h1{margin:5px 0;font-size:28px}.small{color:#ad8b76;font-size:13px}.hero,.card,.stat{background:#fffcf5;border:2px solid #f1d4b9;border-radius:24px;box-shadow:0 4px 0 #eed5bd}.hero{padding:20px;margin:20px 0;display:flex;align-items:center;justify-content:space-between}.hero b{font-size:19px}.face{font-size:60px;background:#ffe0af;border-radius:50%;padding:12px;border:3px solid #dcab7e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:14px 5px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#a48a79}.bar{height:12px;border-radius:20px;background:#f9e4d2;overflow:hidden}.fill{height:100%;background:#f3ac7c}.card{padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-weight:850;font-size:17px}.chip{font-size:12px;background:#fce4cd;padding:6px 10px;border-radius:20px;white-space:nowrap}.count{text-align:center;margin:18px 0;font-size:37px;font-weight:850}.count small{font-size:15px;color:#ad8b76}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}button{font:inherit;cursor:pointer;border:2px solid #edc6a4;border-radius:14px;padding:11px 12px;background:white;color:#75513f;font-weight:800}button.primary{background:#f5b27f}.tabs button{padding:8px;font-size:12px}.tabs button.on{background:#f5b27f}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tools button{font-size:12px}.muted{font-size:12px;color:#ac8d78}.empty{text-align:center;padding:35px 15px;border:2px dashed #eccbaa;border-radius:20px}.foot{text-align:center;font-size:12px;color:#aa8c79;margin-top:30px}dialog{border:2px solid #e8c9a9;border-radius:23px;background:#fffaf2;color:#75513f;width:min(92vw,420px);padding:20px}dialog::backdrop{background:#45302377}label{display:block;margin:12px 0;font-size:13px;font-weight:bold}input,select{width:100%;font:inherit;padding:11px;margin-top:6px;border:2px solid #f1d4b9;border-radius:12px;background:white;color:#75513f}section.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:25px}h2{font-size:18px}.minor{background:none;border:none;text-decoration:underline;padding:6px;font-size:12px;color:#997a66}.footerbuttons{display:flex;justify-content:flex-end;gap:4px;margin-top:12px}@media(min-width:600px){#cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{margin:0}}</style></head>
<body><main><div class="top"><div><div class="small">✿ LITTLE PINGPONG DIARY</div><h1>몽글 핑퐁 기록장 ♡</h1><div class="small">커미션마다 핑퐁을 차곡차곡!</div></div><button onclick="edit()">＋ 추가</button></div>
<div class="hero"><div><b>오늘도 수고했어! ☀</b><p class="small">한 번씩 기록하면<br>어느새 목표에 도착할 거야.</p></div><div class="face" aria-label="귀여운 오렌지빛 동물 얼굴">૮ •ᴥ• ა</div></div>
<div class="stats"><div class="stat"><span>전체 커미션</span><b id="total">0</b></div><div class="stat"><span>진행 중</span><b id="active">0</b></div><div class="stat"><span>누적 핑퐁</span><b id="sum">0</b></div></div>
<section class="heading"><h2>✿ 나의 커미션</h2><div class="tabs"><button data-f="active" class="on">진행</button><button data-f="done">완료</button><button data-f="all">전체</button></div></section><div id="cards"></div>
<div class="tools"><button onclick="backup()">↓ 백업 저장</button><button onclick="document.getElementById('file').click()">↑ 백업 불러오기</button><input id="file" type="file" accept=".json" hidden onchange="restore(event)"></div><p class="foot">♡ 기록은 이 브라우저에 저장돼요. 정기적으로 백업해 주세요.<br>오리지널 디자인의 팬 감성 기록장</p></main>
<dialog id="dlg"><form id="form"><h2 id="formtitle">커미션 추가 ♡</h2><input id="id" type="hidden"><label>커미션 이름<input id="name" maxlength="70" placeholder="예: 아나킨 × 오비완" required></label><label>플랫폼<select id="platform"><option>X (트위터)</option><option>네이버 밴드</option><option>디스코드</option><option>기타</option></select></label><label>목표 핑퐁<input id="goal" type="number" min="1" max="999999" value="100" required></label><label>현재 핑퐁<input id="count" type="number" min="0" max="999999" value="0" required></label><label>시작일<input id="date" type="date"></label><div class="row"><button type="button" onclick="dlg.close()">취소</button><button class="primary">저장 ♡</button></div></form></dialog>
<script>
const KEY='mongle-pingpong-v1';let data=[],filter='active';try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))data=d}catch(e){}const $=id=>document.getElementById(id),dlg=$('dlg');function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장 실패! 브라우저 저장 설정을 확인해 주세요.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('total').textContent=data.length;$('active').textContent=data.filter(x=>!x.done).length;$('sum').textContent=data.reduce((s,x)=>s+Number(x.count||0),0);document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===filter));const shown=data.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));$('cards').innerHTML=shown.length?shown.map(x=>{const n=data.indexOf(x),percent=Math.round(x.count/x.goal*100);return `<article class="card"><div class="top"><div><div class="name">${esc(x.name)}</div><div class="small">${esc(x.platform)} ${x.date?'· '+esc(x.date):''}</div></div><span class="chip">${x.done?'완료 ♡':'진행 중'}</span></div><div class="count">${x.count}<small> / ${x.goal} 핑퐁</small></div><div class="bar"><div class="fill" style="width:${Math.min(100,percent)}%"></div></div><p class="muted" style="text-align:right">${percent}% 달성</p><div class="row"><button onclick="adjust(${n},-1)">−1</button><button class="primary" onclick="adjust(${n},1)">＋1 핑퐁</button><button onclick="adjust(${n},5)">＋5</button></div><div class="footerbuttons"><button class="minor" onclick="edit(${n})">수정</button><button class="minor" onclick="toggle(${n})">${x.done?'재개':'완료'}</button><button class="minor" onclick="removeItem(${n})">삭제</button></div></article>`}).join(''):'<div class="empty">아직 기록이 없어요! ♡<br>＋ 추가 버튼을 눌러 보세요.</div>'}
function adjust(n,v){data[n].count=Math.max(0,data[n].count+v);save();render()}function toggle(n){data[n].done=!data[n].done;save();render()}function removeItem(n){if(confirm('이 커미션을 삭제할까요?')){data.splice(n,1);save();render()}}
function edit(n){$('form').reset();$('id').value=n===undefined?'':n;$('formtitle').textContent=n===undefined?'커미션 추가 ♡':'커미션 수정 ♡';if(n!==undefined){const x=data[n];$('name').value=x.name;$('platform').value=x.platform;$('goal').value=x.goal;$('count').value=x.count;$('date').value=x.date||''}else{$('goal').value=100;$('count').value=0;$('date').value=new Date().toLocaleDateString('sv-SE')}dlg.showModal()}
$('form').addEventListener('submit',e=>{e.preventDefault();const x={name:$('name').value.trim(),platform:$('platform').value,goal:Number($('goal').value),count:Number($('count').value),date:$('date').value};if(!x.name||!Number.isInteger(x.goal)||x.goal<1||x.goal>999999||!Number.isInteger(x.count)||x.count<0||x.count>999999)return alert('올바른 값을 입력해 주세요.');const n=$('id').value;if(n==='')data.unshift({...x,done:false});else Object.assign(data[Number(n)],x);save();dlg.close();render()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});function backup(){const blob=new Blob([JSON.stringify({version:1,projects:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mongle-pingpong-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function restore(e){const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('파일이 너무 큽니다');const v=JSON.parse(await file.text());if(!Array.isArray(v.projects)||v.projects.length>5000)throw Error('지원하지 않는 백업입니다');if(confirm('현재 기록을 백업 기록으로 교체할까요?')){data=v.projects.filter(x=>x&&typeof x.name==='string'&&Number(x.goal)>0).map(x=>({name:String(x.name).slice(0,70),platform:String(x.platform||'기타').slice(0,30),goal:Math.min(999999,Math.max(1,Math.floor(Number(x.goal)))),count:Math.min(999999,Math.max(0,Math.floor(Number(x.count)||0))),date:String(x.date||''),done:!!x.done}));save();render()}}catch(err){alert('불러오기 실패: '+err.message)}e.target.value=''}render();
</script></body></html>
